name: Build & Release APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "Keystore decoded."
          else
            echo "No keystore secret — APK will be unsigned (debug-signed by Gradle)."
          fi

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="0.0.${{ github.run_number }}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build release APK
        env:
          KEYSTORE_BASE64:    ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.version.outputs.VERSION_NAME }}

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk \
             "artifacts/SmsForwarder-${{ steps.version.outputs.VERSION_NAME }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-${{ steps.version.outputs.VERSION_NAME }}
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SMS Forwarder ${{ steps.version.outputs.VERSION_NAME }}"
          body: |
            ## SMS Forwarder v${{ steps.version.outputs.VERSION_NAME }}

            ### Install
            Download the APK file and install it on your Android device.

            ### Changes
            See [Commits](../../commits/${{ github.ref_name }}) for full changelog.
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
