name: Build v2 APK (Android 10+)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'SmsForwarder-v2/**'
    tags:
      - 'v2-*'

jobs:
  build:
    name: Build v2 APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: SmsForwarder-v2

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "Keystore decoded."
          else
            echo "No keystore — APK will be debug-signed."
          fi

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v2-* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v2-}"
          else
            VERSION_NAME="2.0.${{ github.run_number }}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build APK
        env:
          KEYSTORE_BASE64:    ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.VERSION_CODE }} \
            -PversionName=${{ steps.version.outputs.VERSION_NAME }} \
            --stacktrace 2>&1 | tee build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|Error |FAILED|Unresolved|\.kt:[0-9]" build_output.txt | tail -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT_CODE

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build_output.txt
          retention-days: 7

      - name: Collect APK
        run: |
          mkdir -p ../artifacts-v2
          cp app/build/outputs/apk/release/*.apk \
             "../artifacts-v2/SmsForwarder-v2-${{ steps.version.outputs.VERSION_NAME }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-v2-${{ steps.version.outputs.VERSION_NAME }}
          path: artifacts-v2/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v2-')
        uses: softprops/action-gh-release@v2
        with:
          name: "SMS Forwarder v2 (Android 10+) — ${{ steps.version.outputs.VERSION_NAME }}"
          body: |
            ## SMS Forwarder v2 — Android 10+ only

            **تغییرات نسبت به نسخه اصلی:**
            - رفع مشکل دریافت SMS روی اندروید 13/14/15 (`RECEIVER_EXPORTED`)
            - حذف کدهای قدیمی (minSdk 29)
            - دیالوگ معافیت از بهینه‌سازی باتری

            **نصب:** فقط روی Android 10 (API 29) و بالاتر کار می‌کند.
          files: artifacts-v2/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

